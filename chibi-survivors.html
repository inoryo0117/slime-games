   ========================================================================= */

// ちびキャラは機関室の slime-survivors に無いので、スライム版と違い公開側のコミットを書く

let scale = 1, offX = 0, offY = 0, cssW = 0, cssH = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const r = cv.getBoundingClientRect();
  cssW = Math.max(1, Math.round(r.width));
  cssH = Math.max(1, Math.round(r.height));
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = Math.min(cssW / W, cssH / H);
  offX = (cssW - W * scale) / 2; offY = (cssH - H * scale) / 2;
  mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

   敵・床・エフェクトも同じ格子に乗せて画風を1手で揃える（タイトル/レベルアップ/終了画面は
   文字が潰れるため対象外＝高解像度のまま mainCtx に直接描く）。 */
const lowCv = document.createElement('canvas');
lowCv.width = W / 2; lowCv.height = H / 2;
const lowCtx = lowCv.getContext('2d');

function toLogical(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  return [((clientX - r.left) - offX) / scale, ((clientY - r.top) - offY) / scale];
}

/* =========================================================================
   決定論的な擬似乱数（描画演出専用。個体ごとの位相ずらしに使う。
   ロジックの乱数とは無関係で、Math.random は使わない）
   ========================================================================= */
function hashFrac(n) {
  const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// 敵1コマを中心そろえで描く。px=シートpx1個を何論理pxで出すか
// （drawEnemy等・lowCtx世界は setTransform(0.5,..) で半分に戻るので px=2 が「シートpxそのまま」。
//  drawTitle/drawLevelupはmainCtx直描きなので px を大きくして見やすくする）。
// flipX=trueで左右反転（進行方向むけの一部コマ専用）。
function drawEnemySpriteScaled(frame, cx, cy, px, flipX) {
  if (!frame) return;
  const dw = frame.w * px, dh = frame.h * px;
  ctx.save();
  ctx.translate(cx, cy);
  if (flipX) ctx.scale(-1, 1);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(enemySpriteImg, frame.x, frame.y, frame.w, frame.h, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
}
function drawEnemySprite(frame, wx, wy, flipX) { drawEnemySpriteScaled(frame, wx, wy, 2, flipX); }

// hashFrac(entId*k) を位相にしたコマ送り（既存の呼吸アニメと同じ流儀）。fps=1秒に何コマ進むか。
function loopFrame(frames, entId, fps) {
  if (!frames || frames.length === 0) return null;
  const phase = hashFrac(entId * 7.13);
  const idx = Math.floor(clock * fps + phase * frames.length) % frames.length;
  return frames[(idx + frames.length) % frames.length];
}

// 死亡演出：潰れ→死亡コマを約0.35秒（ボスは爆散パーティクル系で約1.2秒）再生する。
// pop イベント（enemyType付き）に載せてfxListで再生する。戻り値trueの間は生かし続ける。
const DEATH_DUR_MINION = 0.35;
const DEATH_DUR_BOSS = 1.2;
function drawEnemyDeath(enemyType, x, y, t) {
  if (!window.__enemySpritesReady) return false;
  const sp = ENEMY_SPRITES[spriteSpecies(enemyType)];
  if (!sp) return false;
  if (enemyType === 'oyamochi') {
    if (t >= DEATH_DUR_BOSS) return false;
    const idx = Math.min(sp.boom.length - 1, Math.floor(t / (DEATH_DUR_BOSS / sp.boom.length)));
    drawEnemySprite(sp.boom[idx], x, y, false);
    return true;
  }
  if (t >= DEATH_DUR_MINION) return false;
  const frame = t < DEATH_DUR_MINION * 0.45 ? (sp.squish ? sp.squish[0] : sp.idle[0]) : (sp.die ? sp.die[0] : sp.idle[0]);
  drawEnemySprite(frame, x, y, false);
  return true;
}

// 'pop' はスプライトの死亡演出と既存の輪・星・ハートの演出を両方鳴らす。
// どちらか長く生きている方に合わせてfxを残す。
function drawFxCombined(fx, x, y, t) {
  const sparkleAlive = drawFX(fx.name, x, y, t);
  let spriteAlive = false;
  if (fx.name === 'pop' && fx.enemyType) spriteAlive = drawEnemyDeath(fx.enemyType, x, y, t);
  return sparkleAlive || spriteAlive;
}
// スプライトの行 = atan2(vy, vx) を45度ずつに割ったセクタ番号。
// 0=右 1=右下 2=下 3=左下 4=左 5=左上 6=上 7=右上（右上は gen_sheet4.py の生成絵、左上はその左右反転）。
let playerFacingRow = 2; // 開始時は正面を向かせる
let playerPrevPos = null; // drawPlayer が自前で持つ前フレーム座標（速度の算出用）
const DIR_SECTOR = Math.PI / 4; // 8方向なので1セクタ45度
// セクタの境目でちょうど半々になると、指のわずかな揺れで毎フレーム向きが裏返って
// カクカクする。かといって「今の向きから○度ずれるまで動かない」方式にすると、
// 斜めに入れる角度の幅そのものが狭くなり、斜めがほとんど出なくなる
// （2026-09-24 実機で発覚。33.75度にしたら斜めの幅が45度→22.5度に潰れていた）。
// そこで「一番近いセクタが、今の向きよりこの角度ぶん近いときだけ乗り換える」に変える。
// 境目に±4度の不感帯ができるだけで、斜めの幅はほぼ45度のまま残る。
const DIR_MARGIN = 0.14; // 約8度
// 「弾を撃つ方に向ける」用：最後に撃った狙い角と、その時刻（clock基準）。
// 撃ってから一定時間は、逃げながら撃っても背中から弾が出て見えないよう
// 移動方向より狙い方向を優先する。
let lastAimAngle = null;
let lastAimT = -999;
const AIM_HOLD = 1.2; // しゃぼんの最長間隔0.9秒より長くして、連射中は狙い方向に固定されるようにする

// 角度→8方向セクタ番号を、不感帯つきで既存の向きから乗り換える共通処理。
// drawPlayer の速度ベース判定と、狙い角ベース判定の両方から使う。
function pickFacingRow(ang, currentRow) {
  const near = ((Math.round(ang / DIR_SECTOR) % 8) + 8) % 8;
  if (near === currentRow) return currentRow;
  // 角度差は -π..π に畳んでから絶対値を取る（0度と360度をまたぐため）
  const gap = (row) => {
    const d = ang - row * DIR_SECTOR;
    return Math.abs(Math.atan2(Math.sin(d), Math.cos(d)));
  };
  return (gap(currentRow) - gap(near) > DIR_MARGIN) ? near : currentRow;
}

const FX_DUR = { shot: 0.10, hit: 0.16, pop: 0.55, hurt: 0.5, levelup: 0.9, strike: 0.35, boss: 1.2, clear: 1.8, heal: 0.55, gem: 0.28 };

/* -------------------------------------------------------------------------
   drawFX(name, x, y, t) — エフェクトはここに集約する。
   加算合成で描くので、後日 mflux 生成のPNG（黒背景=光のみ）へ差し替えても
   見た目の破綻が出ない設計。
   ------------------------------------------------------------------------- */
function drawFX(name, x, y, t) {
  const dur = FX_DUR[name] ?? 0.4;
  const p = Math.max(0, Math.min(1, t / dur));
  if (p >= 1) return false;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  if (name === 'shot') {
    ctx.globalAlpha = (1 - p) * 0.45;
    ctx.fillStyle = '#eaf6ff';
    ctx.beginPath(); ctx.arc(x, y, 4 + p * 5, 0, Math.PI * 2); ctx.fill();
  } else if (name === 'hit') {
    ctx.globalAlpha = (1 - p) * 0.55;
    ctx.fillStyle = '#fff7cf';
    ctx.beginPath(); ctx.arc(x, y, 3 + p * 7, 0, Math.PI * 2); ctx.fill();
  } else if (name === 'pop') {
    // 2026-09-25: 敵スプライトの死亡コマ（潰れ→死亡／ボスは爆散）が同時に鳴るようになった
    // ため、この輪・星・ハートは「添える程度」に弱める（元は0.7/0.95/1.0だった）。
    // 輪が広がる
    ctx.globalAlpha = (1 - p) * 0.4;
    ctx.strokeStyle = '#ffe3f2';
    ctx.lineWidth = 3 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(x, y, 6 + p * 34, 0, Math.PI * 2); ctx.stroke();
    // 星型の粒が4つ散る
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + i * 0.4;
      const dist = p * 26;
      const sx = x + Math.cos(a) * dist, sy = y + Math.sin(a) * dist;
      ctx.globalAlpha = (1 - p) * 0.6;
      drawStar(sx, sy, 4 * (1 - p * 0.5), '#fff0b8');
    }
    // 小さなハートが1つ、ふわっと浮かぶ
    ctx.globalAlpha = (1 - p) * 0.65;
    drawHeart(x, y - p * 22, 6, '#ffc7dd');
  } else if (name === 'hurt') {
    // 画面ふちに淡いピンクのにじみが脈打つ（赤フラッシュではなく縁だけの淡いビネット）
    const pulse = 0.5 + 0.5 * Math.sin(p * Math.PI * 3);
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.72);
    g.addColorStop(0, 'rgba(255,190,210,0)');
    g.addColorStop(1, 'rgba(255,170,200,' + (0.22 * (1 - p) * pulse) + ')');
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  } else if (name === 'gem') {
    ctx.globalAlpha = (1 - p) * 0.9;
    ctx.fillStyle = '#eafff2';
    ctx.beginPath(); ctx.arc(x, y, 2 + p * 8, 0, Math.PI * 2); ctx.fill();
  } else if (name === 'strike') {
    ctx.globalAlpha = (1 - p) * 0.85;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const r0 = 6, r1 = 6 + p * 40;
      ctx.strokeStyle = '#fff1b0';
      ctx.lineWidth = 3 * (1 - p);
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);
      ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
      ctx.stroke();
    }
  } else if (name === 'levelup' || name === 'heal') {
    const col = name === 'levelup' ? '#fff3b0' : '#c8ffd6';
    ctx.globalAlpha = (1 - p) * 0.8;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      const dist = 20 + p * 40;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * dist, y + Math.sin(a) * dist, 4 * (1 - p) + 1, 0, Math.PI * 2); ctx.fill();
    }
  } else if (name === 'boss') {
    ctx.globalAlpha = (1 - p) * 0.5;
    ctx.strokeStyle = '#ffcfa0';
    ctx.lineWidth = 6 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(x, y, 20 + p * 140, 0, Math.PI * 2); ctx.stroke();
  } else if (name === 'clear') {
    ctx.globalAlpha = (1 - p) * 0.85;
    for (let i = 0; i < 14; i++) {
      const a = i * 0.9 + p * 2;
      const dist = 20 + p * 200;
      ctx.fillStyle = i % 2 === 0 ? '#ffe3b0' : '#c8f0ff';
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * dist, y + Math.sin(a) * dist * 0.6 - p * 60, 4, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  return true;
}

function drawStar(cx, cy, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? r : r * 0.45;
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawHeart(cx, cy, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.8);
  ctx.bezierCurveTo(cx - r * 1.3, cy - r * 0.5, cx - r * 0.4, cy - r * 1.3, cx, cy - r * 0.35);
  ctx.bezierCurveTo(cx + r * 0.4, cy - r * 1.3, cx + r * 1.3, cy - r * 0.5, cx, cy + r * 0.8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* -------------------------------------------------------------------------
   レベルアップカードのメダル絵（T-2a）。丸・楕円・線・既存ヘルパーだけで描く
   （画像ファイルは作らない・読まない＝仕様書§10）。8種すべて見分けがつく形に。
   ------------------------------------------------------------------------- */
function drawUpgradeIcon(cx, cy, key, color) {
  // 本編のスライムと同じ塗り方：地の色はそのままパステル、輪郭だけ濃く縁取る
  // （darken(color,0.45)を主形状の塗りに使わない＝2026-09-24 判定ツール修正後の方針）。
  const deep = darken(color, 0.45);
  ctx.save();
  if (key === 'bubble') {
    ctx.fillStyle = color;
    ctx.strokeStyle = deep;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx - 5, cy + 6, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 11, cy - 7, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(cx - 9, cy + 1, 2.2, 0, Math.PI * 2); ctx.fill();
  } else if (key === 'ring') {
    // 花びら2枚が自機のまわりを円軌道で回っている絵。軌道線を描き、その上下に
    // 花びらを離して置く（左右に並べて下側でつなげると口ひげに見えるため上下にする）。
    ctx.strokeStyle = deep;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, 17, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = color;
    ctx.strokeStyle = deep;
    ctx.lineWidth = 1.8;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(cx, cy + s * 17, 8.5, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else if (key === 'konpeito') {
    // 星はそのまま（読める）。まわりの茶色い点2つ（何を表すか説明できない）は消す。
    drawStar(cx, cy, 13, color);
  } else if (key === 'mame') {
    // 豆3粒。地はパステル・縁だけ濃くする
    const spots = [[-10, 7], [0, -5], [10, 8]];
    ctx.strokeStyle = deep;
    ctx.lineWidth = 1.8;
    for (const [dx, dy] of spots) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.ellipse(cx + dx, cy + dy, 7, 5, 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(cx + dx - 1.5, cy + dy - 1, 2, 1.3, 0.5, 0, Math.PI * 2); ctx.fill();
    }
  } else if (key === 'boots') {
    // 右向きの矢印を3つ、右へ行くほど不透明にして「速い」を表す
    const arrows = [[-15, 0.35], [0, 0.65], [15, 1.0]];
    ctx.strokeStyle = deep;
    ctx.lineWidth = 1.8;
    for (const [dx, a] of arrows) {
      ctx.globalAlpha = a;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(cx + dx - 7, cy - 8);
      ctx.lineTo(cx + dx - 7, cy + 8);
      ctx.lineTo(cx + dx + 9, cy);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (key === 'magnet') {
    // 上向きに開くU字（帯）。両端を極（赤・青）でふさぎ、開いた側に
    // かけらと同じ形の小さな青い菱形を1つだけ置く（点2つは目に見えるため置かない）。
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(cx + 10, cy - 10);
      ctx.lineTo(cx + 9.51, cy + 6.09);
      ctx.arc(cx, cy + 3, 10, Math.PI * 0.1, Math.PI * 0.9, false);
      ctx.lineTo(cx - 10, cy - 10);
    };
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = deep; ctx.lineWidth = 10.5; path(); ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = 7.5; path(); ctx.stroke();
    ctx.fillStyle = '#e8a0a8';
    roundRect(cx - 18, cy - 18, 16, 17, 2); ctx.fill();
    ctx.fillStyle = '#9fb8e0';
    roundRect(cx + 2, cy - 18, 16, 17, 2); ctx.fill();
    ctx.save();
    ctx.translate(cx, cy - 2);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#5eb0ea';
    ctx.fillRect(-6.5, -6.5, 13, 13);
    ctx.restore();
  } else if (key === 'heart') {
    // ハートはそのまま（読める）。下の黒い点2つ（何を表すか説明できない）は消す。
    drawHeart(cx, cy, 13, color);
  } else if (key === 'charm') {
    // 縦長の巾着（横長だと箱に見えるため縦にする）。上に紐、中央に合わせ目の縦線
    ctx.fillStyle = color;
    ctx.strokeStyle = deep;
    ctx.lineWidth = 1.8;
    roundRect(cx - 11, cy - 14, 22, 28, 6);
    ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy + 12); ctx.stroke();
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(cx + s * 6, cy - 15, 2.6, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(cx - 6, cy - 15); ctx.quadraticCurveTo(cx, cy - 20, cx + 6, cy - 15); ctx.stroke();
  }
  ctx.restore();
}

/* -------------------------------------------------------------------------
   可愛さ1・2：丸いシルエット＋つぶれ伸び（squash & stretch）
   entId ごとに hashFrac から周期0.5〜0.7秒・位相をずらして「呼吸」させ、
   進行方向へ伸び・直交方向へ縮む。牙・角・トゲは一切足さない。
   ------------------------------------------------------------------------- */
function creatureAnim(entId, x, y, vx, vy) {
  const prev = entPrev.get(entId) || { angle: Math.PI / 2 };
  const speed = Math.hypot(vx, vy);
  const angle = speed > 4 ? Math.atan2(vy, vx) : prev.angle;
  entPrev.set(entId, { x, y, angle });
  const period = 0.5 + hashFrac(entId * 3.7) * 0.2;
  const phase0 = hashFrac(entId * 9.13) * Math.PI * 2;
  const phaseAngle = (clock / period) * Math.PI * 2 + phase0;
  const pulse = Math.sin(phaseAngle) * 0.06;
  const stretchAmt = Math.min(0.32, speed / 220);
  const along = 1 + stretchAmt + pulse * 0.5;
  const across = 1 - stretchAmt * 0.6 + pulse * 0.5;
  return { angle, along, across };
}

/* 輪郭線用：hex を暗く寄せる（背景と本体を剥がすための細い縁取りに使う） */
function darken(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * k);
  const g = Math.round(((n >> 8) & 255) * k);
  const b = Math.round((n & 255) * k);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawCreature(x, y, r, anim, main, shade, eyeGap) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(anim.angle);
  ctx.scale(anim.along, anim.across);
  // 影は黒の半透明ではなく地面色を暗く寄せた色（本体の下にずらして描く）
  ctx.save();
  ctx.rotate(-anim.angle);
  ctx.fillStyle = COL.shadow;
  ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.ellipse(0, r * 0.55, r * 0.85, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 本体（角のない丸い塊）
  const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.2, 0, 0, r * 1.05);
  grad.addColorStop(0, main);
  grad.addColorStop(1, shade);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  // 背景と本体を剥がすための細い縁取り（塗った直後の同じパスへ）
  // 2026-09-24: 低解像度レイヤー導入後、敵に縁取りが無いと主人公のスプライト
  // （太い暗色の輪郭を持つ）だけが浮いて見えた。輪郭を1ドット(論理2px)以上・
  // より暗い色にして、敵も同じ画風に寄せる。
  ctx.strokeStyle = darken(shade, 0.42);
  ctx.lineWidth = Math.max(2, r * 0.14);
  ctx.stroke();
  // 上側の細い白いリムライトで立体感
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.lineWidth = Math.max(1, r * 0.12);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.86, Math.PI * 1.05, Math.PI * 1.75); ctx.stroke();
  ctx.restore();
  // 目（大きめ・角度に依存させず常に前を向く安心感のある顔）
  ctx.save();
  ctx.translate(x, y);
  const eg = r * (eyeGap || 0.34);
  const ey = -r * 0.06;
  const er = r * 0.30;
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#fffdf6';
    ctx.beginPath(); ctx.ellipse(s * eg, ey, er, er * 1.08, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5b5442';
    ctx.beginPath(); ctx.arc(s * eg + s * er * 0.18, ey + er * 0.22, er * 0.46, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(s * eg - er * 0.12, ey - er * 0.28, er * 0.16, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* =========================================================================
   カメラ（ワールド端で止める＝画面外の黒帯を出さない）
   ========================================================================= */
const VIEW_TOP = 130; // HUDパネル分は上に確保するが、地面はその下にも継続して見える
// カメラを世界の端でぴったり止めると、自機がその端で画面の縁に貼り付いて
// 上下左右が切れる（2026-09-24 実機で発覚）。端を越えて少し余白を残す。
const CAM_EDGE = 165;
function camera() {
  const p = game.player;
  let cx = p.x - W / 2;
  let cy = p.y - (H + VIEW_TOP) / 2;
  cx = Math.max(-CAM_EDGE, Math.min(WORLD - W + CAM_EDGE, cx));
  cy = Math.max(-CAM_EDGE, Math.min(WORLD - H + CAM_EDGE, cy));
  return { x: cx, y: cy };
}

/* =========================================================================
   地面（薄いチェック模様でスクロールを感じさせる）
   ========================================================================= */
const GROUND_CELL = 40; // 2026-09-24: 78→40（低解像度canvas上で20ドット）。石畳らしい粒度にする
const OUTSIDE_COL = '#232833'; // 世界の外：暗い石タイルよりさらに一段沈めた色
const TILE_A = '#3b4250';
const TILE_B = '#343a47';
const TILE_JOINT = '#171a21'; // タイルの境界に引く目地線（幅2px・#20242eからもう一段暗く）
// タイル基準色の明度を±8%の範囲でタイルごとに振り、市松の均一さを崩して石畳の個体差を出す
function shadeTile(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const k = 1 + amt;
  const clamp = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
  const r = clamp((n >> 16) & 255), g = clamp((n >> 8) & 255), b = clamp(n & 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function drawGround(cam) {
  // 世界の外（CAM_EDGE の余白で見えてしまう帯）はまず暗い色で塗っておく
  ctx.fillStyle = OUTSIDE_COL;
  ctx.fillRect(0, 0, W, H);
  // 世界の内側だけを石タイルの地色で塗り直す（個体差の乗ったタイルは後段で上書きする）
  ctx.fillStyle = TILE_A;
  ctx.fillRect(-cam.x, -cam.y, WORLD, WORLD);

  const startCol = Math.floor(cam.x / GROUND_CELL) - 1;
  const startRow = Math.floor(cam.y / GROUND_CELL) - 1;
  const cols = Math.ceil(W / GROUND_CELL) + 2;
  const rows = Math.ceil(H / GROUND_CELL) + 2;
  ctx.strokeStyle = TILE_JOINT;
  ctx.lineWidth = 2;
  for (let ry = 0; ry < rows; ry++) {
    for (let rx = 0; rx < cols; rx++) {
      const col = startCol + rx, row = startRow + ry;
      const wx = col * GROUND_CELL, wy = row * GROUND_CELL;
      // 市松模様・目地は世界の内側にだけ描く（外は沈めた色のまま）
      if (wx < 0 || wy < 0 || wx >= WORLD || wy >= WORLD) continue;
      // 市松をやめて「1色＋タイルごとの個体差」にする。規則正しい市松が残っていると
      // 方眼紙に見える最大の原因になり、明度差を振っても消えない（2026-09-24 実測）。
      const base = TILE_A;
      const variance = (hashFrac(col * 131.7 + row * 421.3) - 0.5) * 0.26; // ±13%
      ctx.fillStyle = shadeTile(base, variance);
      ctx.fillRect(wx - cam.x, wy - cam.y, GROUND_CELL, GROUND_CELL);
      ctx.strokeRect(wx - cam.x, wy - cam.y, GROUND_CELL, GROUND_CELL);
    }
  }

  // 世界の境界線
  ctx.save();
  ctx.strokeStyle = '#12151b';
  ctx.lineWidth = 3;
  ctx.strokeRect(-cam.x, -cam.y, WORLD, WORLD);
  ctx.restore();
}

/* =========================================================================
   HUD（半透明の白パネル。HP・時間・レベル/XP・撃破数）
   ========================================================================= */
function fmtTime(t) {
  const s = Math.max(0, Math.floor(t));
  const m = Math.floor(s / 60), r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawHud() {
  const p = game.player;
  const pad = 12, top = 10, panelW = W - pad * 2, panelH = 88;
  ctx.save();
  ctx.fillStyle = COL.panel;
  ctx.strokeStyle = COL.panelBorder;
  ctx.lineWidth = 1;
  roundRect(pad, top, panelW, panelH, 16);
  ctx.fill(); ctx.stroke();

  // HPバー
  const hpRatio = Math.max(0, p.hp / p.maxHp);
  const barX = pad + 14, barY = top + 14, barW = panelW - 100, barH = 12;
  roundRect(barX, barY, barW, barH, 6);
  ctx.fillStyle = 'rgba(120,110,80,.15)'; ctx.fill();
  const hpCol = hpRatio > 0.5 ? COL.hpFull : (hpRatio > 0.25 ? COL.hpMid : COL.hpLow);
  roundRect(barX, barY, barW * hpRatio, barH, 6);
  ctx.fillStyle = hpCol; ctx.fill();
  ctx.fillStyle = COL.ink;
  ctx.font = '700 11px -apple-system, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('HP', barX, barY - 8);
  ctx.textAlign = 'right';
  ctx.fillText(Math.ceil(p.hp) + '/' + p.maxHp, barX + barW, barY - 8);

  // 経過時間
  ctx.textAlign = 'right';
  ctx.font = '700 18px -apple-system, sans-serif';
  ctx.fillStyle = COL.ink;
  ctx.fillText(fmtTime(game.t), pad + panelW - 14, top + 20);

  // レベル + XPバー
  const xpY = barY + barH + 16;
  ctx.textAlign = 'left';
  ctx.font = '700 11px -apple-system, sans-serif';
  ctx.fillStyle = COL.ink;
  ctx.fillText('Lv' + p.level, barX, xpY - 8);
  const xpRatio = p.xpNeed > 0 ? Math.max(0, Math.min(1, p.xp / p.xpNeed)) : 0;
  roundRect(barX + 30, xpY - 12, barW - 30, 8, 4);
  ctx.fillStyle = 'rgba(120,110,80,.15)'; ctx.fill();
  roundRect(barX + 30, xpY - 12, (barW - 30) * xpRatio, 8, 4);
  ctx.fillStyle = COL.xp; ctx.fill();

  // 撃破数
  ctx.textAlign = 'right';
  ctx.font = '700 12px -apple-system, sans-serif';
  ctx.fillStyle = COL.inkSoft;
  drawStar(pad + panelW - 60, xpY - 8, 6, '#f0c96e');
  ctx.fillText('×' + game.kills, pad + panelW - 14, xpY - 4);

  // 所持品（取ったもの）を2行4列のチップで出す。持っていないものは描かない。
  // §T-3：行高18→16・行間22→20に詰め、panelHの短縮に合わせる（文字サイズは変えない）。
  const chipW = 82, chipH = 16, chipX0 = 22, chipPitch = 88, chipRowPitch = 20;
  let ci = 0;
  for (const o of OWNED_VIEW) {
    const lv = game.owned[o.key];
    if (!lv) continue;
    const cx = chipX0 + (ci % 4) * chipPitch;
    const cy = top + 52 + Math.floor(ci / 4) * chipRowPitch;
    roundRect(cx, cy, chipW, chipH, 8);
    ctx.fillStyle = o.color; ctx.fill();
    ctx.font = '400 9.5px -apple-system, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = COL.ink;
    ctx.fillText(o.name, cx + 8, cy + chipH / 2);
    ctx.font = '700 9.5px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(String(lv), cx + chipW - 8, cy + chipH / 2);
    ci += 1;
  }

  ctx.restore();
  return top + panelH;
}

/* =========================================================================
   ボス戦の表示。ボス本体の上の小さなバーだけでは、ボスが画面外に出た瞬間に
   残りHPも居場所も分からなくなるため、画面上部に常設バー＋画面端に方向の印を出す。
   ========================================================================= */
function drawBossUi(cam) {
  const boss = game.enemies.find((e) => e.type === 'oyamochi');
  if (!boss) return null;
  const col = ENEMY_COLOR.oyamochi;
  ctx.save();

  // 常設HPバー（HUDパネルのすぐ下）。HUDと同じ半透明の白板を敷いてから描く
  // ＝地面のチェック模様の上に直接文字を置くとコントラストが 3.03:1 まで落ちるため。
  // §T-3：プレート高さ38→30に詰め、新しいHUDパネル下端(top+panelH=98)のすぐ下から開始する。
  const plateX = 12, plateW = W - 24, plateY = 100, plateH = 30;
  const x = 14, barW = W - 28, y = plateY + 13;
  roundRect(plateX, plateY, plateW, plateH, 10);
  ctx.fillStyle = COL.panel;
  ctx.fill();
  ctx.strokeStyle = COL.panelBorder;
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.font = '700 11px -apple-system, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = COL.ink;
  ctx.fillText('おやもち', x + 2, y);
  ctx.textAlign = 'right';
  ctx.fillStyle = COL.ink;
  ctx.fillText(Math.ceil(boss.hp) + '/' + boss.maxHp, x + barW - 2, y);
  roundRect(x, y + 6, barW, 8, 4);
  ctx.fillStyle = 'rgba(120,110,80,.18)'; ctx.fill();
  roundRect(x, y + 6, barW * Math.max(0, boss.hp / boss.maxHp), 8, 4);
  ctx.fillStyle = col.shade; ctx.fill();

  // ボスが画面外なら、画面のふちに方向の印を出す
  const bx = boss.x - cam.x, by = boss.y - cam.y;
  const out = bx < -boss.r || bx > W + boss.r || by < -boss.r || by > H + boss.r;
  if (out) {
    const m = 30;
    const ax = Math.max(m, Math.min(W - m, bx));
    const ay = Math.max(VIEW_TOP + 48, Math.min(H - m, by));
    const ang = Math.atan2(by - ay, bx - ax);
    // 顔色の丸
    ctx.globalAlpha = 0.92;
    ctx.beginPath(); ctx.arc(ax, ay, 13, 0, Math.PI * 2);
    ctx.fillStyle = col.main; ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = col.shade; ctx.stroke();
    // 外向きの三角
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(22, 0); ctx.lineTo(12, -7); ctx.lineTo(12, 7);
    ctx.closePath();
    ctx.fillStyle = col.shade; ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  return plateY + plateH;
}

/* =========================================================================
   入力：相対スティック（タッチ）＋ WASD / 矢印
   ========================================================================= */
const STICK_MAX = 44;
let stick = null; // { ox, oy, dx, dy }（すべて論理px）
const keys = {};
let input = { mx: 0, my: 0 };

function currentInput() {
  let mx = 0, my = 0;
  if (stick) {
    mx = stick.dx / STICK_MAX; my = stick.dy / STICK_MAX;
  }
  let kx = 0, ky = 0;
  if (keys.ArrowLeft || keys.KeyA) kx -= 1;
  if (keys.ArrowRight || keys.KeyD) kx += 1;
  if (keys.ArrowUp || keys.KeyW) ky -= 1;
  if (keys.ArrowDown || keys.KeyS) ky += 1;
  if (kx || ky) { mx = kx; my = ky; }
  const mag = Math.hypot(mx, my);
  if (mag > 1) { mx /= mag; my /= mag; }
  return { mx, my };
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const [x, y] = toLogical(e.clientX, e.clientY);
  if (handleTap(x, y)) return;
  if (uiPhase === 'play' && game && game.status === 'playing') {
    stick = { ox: x, oy: y, dx: 0, dy: 0, pid: e.pointerId };
  }
}, { passive: false });
window.addEventListener('pointermove', (e) => {
  if (!stick || stick.pid !== e.pointerId) return;
  const [x, y] = toLogical(e.clientX, e.clientY);
  let dx = x - stick.ox, dy = y - stick.oy;
  const d = Math.hypot(dx, dy);
  if (d > STICK_MAX) { dx = dx / d * STICK_MAX; dy = dy / d * STICK_MAX; }
  stick.dx = dx; stick.dy = dy;
}, { passive: true });
function releaseStick(e) { if (stick && (!e || stick.pid === e.pointerId)) stick = null; }
window.addEventListener('pointerup', releaseStick, { passive: true });
window.addEventListener('pointercancel', releaseStick, { passive: true });
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'KeyF' && uiPhase === 'play' && game && game.status === 'playing') {
    speedMul = nextSpeed(speedMul);
  }
}, { passive: false });
window.addEventListener('keyup', (e) => { keys[e.code] = false; }, { passive: true });
window.addEventListener('contextmenu', (e) => e.preventDefault());

// iOS Safari は user-scalable=no を無視するので、拡大のきっかけを塞ぐ
for (const t of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
}
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd < 350) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

/* =========================================================================
   タップ判定（タイトル／レベルアップ／終了画面のボタン。canvas描画のみで
   完結させる。DOM要素は使わない）
   ========================================================================= */
function levelupCards() {
  if (!game || game.status !== 'levelup') return [];
  const cardW = W - 48, cardH = 104, gap = 14;
  const totalH = game.offers.length * cardH + (game.offers.length - 1) * gap;
  // 相対スティックで移動中は親指が画面下側にいるため、画面下270px（画面高844の
  // 約1/3）を空けてカードを上へ戻す下端固定（2026-09-24 再修正）。
  const BOTTOM_KEEP = 270;
  const startY = H - BOTTOM_KEEP - totalH;
  return game.offers.map((o, i) => ({
    offer: o, x: 24, y: startY + i * (cardH + gap), w: cardW, h: cardH,
  }));
}
/* タイトルのむずかしさカード。描画と当たり判定で同じ座標を使う。 */
function diffCards() {
  const w = W - 48, h = 56, gap = 12, top = 556;
  return DIFF_ORDER.map((key, i) => ({ key, x: 24, y: top + i * (h + gap), w, h }));
}

/* 倍速ボタン。描画と当たり判定で同じ座標を使う。 */
function speedButton() {
  const w = 60, h = 44;
  return { x: W - 12 - w, y: H - 12 - h, w, h };
}
function handleTap(x, y) {
  if (uiPhase === 'title') {
    for (const c of diffCards()) {
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) { startRun(c.key); return true; }
    }
    return true;
  }
  if (!game) return false;
  if (game.status === 'levelup') {
    for (const c of levelupCards()) {
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        chooseUpgrade(game, c.offer.key);
        return true;
      }
    }
    return true;
  }
  if (game.status === 'gameover' || game.status === 'clear') {
    if (y > H / 2 + 70 && y < H / 2 + 130) { startRun(); return true; }
    return true;
  }
  if (game.status === 'playing') {
    const b = speedButton();
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      speedMul = nextSpeed(speedMul);
      return true;
    }
  }
  return false;
}

function startRun(diffKey) {
  if (diffKey) chosenDiff = diffKey;
  game = createGame((Date.now() >>> 0), chosenDiff);
  uiPhase = 'play';
  fxList = [];
  entPrev.clear();
  playerHurtT = 999;
  bossBanner = 0;
  stick = null;
  speedMul = 1;
  lastAimAngle = null;
  lastAimT = -999;
}

/* =========================================================================
   描画本体
   ========================================================================= */
function handleEvents(events) {
  for (const ev of events) {
    if (ev.type === 'shot') {
      fxList.push({ name: 'shot', x: ev.x, y: ev.y, t0: clock });
      // 撃った方向を向かせるため、狙い角(tx,ty)を記録する
      if (ev.tx != null && ev.ty != null) {
        lastAimAngle = Math.atan2(ev.ty - ev.y, ev.tx - ev.x);
        lastAimT = clock;
      }
    }
    else if (ev.type === 'hit') fxList.push({ name: 'hit', x: ev.x, y: ev.y, t0: clock });
    else if (ev.type === 'pop') fxList.push({ name: 'pop', x: ev.x, y: ev.y, t0: clock, enemyType: ev.enemyType });
    else if (ev.type === 'hurt') { fxList.push({ name: 'hurt', x: ev.x, y: ev.y, t0: clock }); playerHurtT = 0; }
    else if (ev.type === 'gem') fxList.push({ name: 'gem', x: ev.x, y: ev.y, t0: clock });
    else if (ev.type === 'strike') fxList.push({ name: 'strike', x: ev.x, y: ev.y, t0: clock });
    else if (ev.type === 'levelup') fxList.push({ name: 'levelup', x: game.player.x, y: game.player.y, t0: clock });
    else if (ev.type === 'heal') fxList.push({ name: 'heal', x: game.player.x, y: game.player.y, t0: clock });
    else if (ev.type === 'boss') { fxList.push({ name: 'boss', x: game.player.x, y: game.player.y, t0: clock }); bossBanner = 2.4; }
    else if (ev.type === 'clear') fxList.push({ name: 'clear', x: game.player.x, y: game.player.y, t0: clock });
    // 'gameover' は status の変化で検知する（見た目はオーバーレイのみ）
  }
}

// e.type から ENEMY_SPRITES のキーへ（oyamochiだけ名前が違う）
function spriteSpecies(type) { return type === 'oyamochi' ? 'boss' : type; }

// 雑魚3種（poyo/tsubu/hane）共通：アイドルループ＋被弾コマ
function pickMinionFrame(e, sp) {
  if (e.hitFlash > 0 && sp.hit) return sp.hit[0];
  return loopFrame(sp.idle, e.id, 2.4);
}

// もち：距離で「穏やか/怒り顔の行動」を切り替える
const MOCHI_ANGRY_DIST = 140;
function pickMochiFrame(e, sp, dist) {
  if (dist <= MOCHI_ANGRY_DIST) return loopFrame(sp.action, e.id, 4);
  return loopFrame(sp.idle, e.id, 1.8);
}

// ボス：被弾＞召喚直前の火柱＞召喚直後の怒り顔＞（通常サイクル：待機/目線⇄前進の突進）
function pickBossFrame(e, sp, dxToPlayer) {
  if (e.hitFlash > 0 && sp.hit) return { frame: sp.hit[0], flip: false };
  const bt = e._bossTimer || 0;
  if (bt >= 3.5) {
    // 残り0.5秒＝ぽよ3体を呼ぶ直前。火柱を焚いて予告する
    return { frame: loopFrame(sp.fire, e.id, 7), flip: false };
  }
  if (bt < 0.4) {
    // 呼んだ直後0.4秒は怒り顔のまま
    return { frame: sp.angry[0], flip: false };
  }
  // 通常サイクル：0.65秒ごとに「待機/目線」⇔「前進の突進」を繰り返す
  // （ロジック側は常に自機へ向かって進み続けるため、速度での切替は事実上常にtrueになり
  //   意味を持たない。時間で区切って「呼吸→突進」のメリハリを出す設計に振った）。
  const period = 1.3, phase = hashFrac(e.id * 3.31) * period;
  const t = (clock + phase) % period;
  const flip = dxToPlayer < 0;
  if (t < 0.85) {
    if (Math.abs(dxToPlayer) > 24) {
      return { frame: dxToPlayer < 0 ? sp.lookL[0] : sp.lookR[0], flip: false };
    }
    return { frame: loopFrame(sp.idle, e.id, 1.5), flip: false };
  }
  return { frame: loopFrame(sp.crawl, e.id, 5), flip };
}

function drawEnemy(e, cam) {
  const anim = creatureAnim('e' + e.id, e.x, e.y,
    (e.x - (entPrev.get('e' + e.id)?.x ?? e.x)) / Math.max(dtRef, 1 / 240),
    (e.y - (entPrev.get('e' + e.id)?.y ?? e.y)) / Math.max(dtRef, 1 / 240));
  const col = ENEMY_COLOR[e.type] || ENEMY_COLOR.poyo;
  const sp = window.__enemySpritesReady ? ENEMY_SPRITES[spriteSpecies(e.type)] : null;
  const sx = e.x - cam.x, sy = e.y - cam.y;
  if (sp) {
    ctx.imageSmoothingEnabled = false;
    if (e.type === 'oyamochi') {
      const dxToPlayer = game.player.x - e.x;
      const { frame, flip } = pickBossFrame(e, sp, dxToPlayer);
      drawEnemySprite(frame, sx, sy, flip);
    } else if (e.type === 'mochi') {
      const dist = Math.hypot(game.player.x - e.x, game.player.y - e.y);
      drawEnemySprite(pickMochiFrame(e, sp, dist), sx, sy, false);
    } else {
      drawEnemySprite(pickMinionFrame(e, sp), sx, sy, false);
    }
  } else {
    // 画像読み込み前の保険：従来の丸ベース描画
    drawCreature(sx, sy, e.r, anim, col.main, col.shade, e.type === 'oyamochi' ? 0.28 : 0.36);
  }
  if (e.hitFlash > 0) {
    // 被弾は赤くせず、白いきらめきを一瞬重ねる（スプライト版でも共通の演出として残す）
    ctx.save();
    ctx.globalAlpha = e.hitFlash / 0.12 * 0.4;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(sx, sy, e.r * 0.95, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  if (e.type === 'oyamochi') {
    // ボスの目印バー（画面上部固定ではなく本体上に小さく）
    const bw = 64, bh = 6;
    const bx = sx - bw / 2, by = sy - e.r - 16;
    roundRect(bx, by, bw, bh, 3);
    ctx.fillStyle = 'rgba(120,110,80,.25)'; ctx.fill();
    roundRect(bx, by, bw * Math.max(0, e.hp / e.maxHp), bh, 3);
    ctx.fillStyle = '#f0a9c4'; ctx.fill();
  }
}

function drawOrbiters(cam) {
  for (const o of game.orbiters) {
    ctx.save();
    ctx.translate(o.x - cam.x, o.y - cam.y);
    ctx.rotate(o.angle);
    const grad = ctx.createLinearGradient(-o.r, 0, o.r, 0);
    grad.addColorStop(0, '#ffb3ce'); grad.addColorStop(1, '#f58db4');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, o.r, o.r * 0.62, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
function drawProjectiles(cam) {
  for (const pr of game.projectiles) {
    const x = pr.x - cam.x, y = pr.y - cam.y;
    if (pr.kind === 'mame') {
      ctx.save();
      ctx.translate(x, y);
      const grad = ctx.createRadialGradient(-pr.r * 0.3, -pr.r * 0.3, 1, 0, 0, pr.r * 1.1);
      grad.addColorStop(0, '#d7e08f'); grad.addColorStop(1, '#adba62');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(0, 0, pr.r * 1.15, pr.r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      const grad = ctx.createRadialGradient(x - pr.r * 0.3, y - pr.r * 0.3, 0.5, x, y, pr.r * 1.2);
      grad.addColorStop(0, 'rgba(255,255,255,.95)');
      grad.addColorStop(0.6, 'rgba(110,175,232,.85)');
      grad.addColorStop(1, 'rgba(110,175,232,.30)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, pr.r * 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}
function drawGems(cam, wantNear) {
  const p = game.player;
  for (const g of game.gems) {
    const x = g.x - cam.x, y = g.y - cam.y;
    // 拾える範囲(距離90以内)は目立たせたままにする（§T-2(b)の抜け道塞ぎ）。
    // それ以外は縮小・落ち着いた色で描き、盤面での主張を弱める。
    // 手元のかけらは敵の重なりで隠れないよう、敵より後に描く（wantNear=trueの呼び出し）。
    const near = Math.hypot(g.x - p.x, g.y - p.y) <= 90;
    if (near !== wantNear) continue;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.PI / 4);
    if (near) {
      const grad = ctx.createLinearGradient(-6, -6, 6, 6);
      grad.addColorStop(0, '#5eb0ea'); grad.addColorStop(1, '#3d86c8');
      ctx.fillStyle = grad;
      ctx.fillRect(-5, -5, 10, 10);
    } else {
      const grad = ctx.createLinearGradient(-3.5, -3.5, 3.5, 3.5);
      grad.addColorStop(0, '#86b4d8'); grad.addColorStop(1, '#5d8bb4');
      ctx.fillStyle = grad;
      ctx.fillRect(-3.5, -3.5, 7, 7);
    }
    ctx.restore();
  }
}
function drawStrikes(cam) {
  for (const s of game.strikes) {
    const ratio = s.life / 0.35;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // 白エフェクトの総量を抑えるため、ピーク不透明度と最大半径を控えめにする
    // （2026-09-24実測：konpeitoの着弾円が種99で画面の3.52%を白く覆っていた）。
    ctx.globalAlpha = ratio * 0.32;
    ctx.fillStyle = '#fff1b0';
    ctx.beginPath(); ctx.arc(s.x - cam.x, s.y - cam.y, s.r * (1.0 - ratio * 0.12), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawPlayer(cam) {
  const p = game.player;
  // 向きと歩行コマに使う速度は、ここで自前に前フレーム位置を持って測る。
  // entPrev.get('player') は使えない——あれは stepGame を呼んだ直後に現在位置へ
  // 更新されるので、render() の時点では必ず差が0になり、速度が常に0に見える
  // （2026-09-24 実機で発覚。向きが正面から一度も変わらなかった原因）。
  let vx = 0, vy = 0;
  if (playerPrevPos) {
    vx = (p.x - playerPrevPos.x) / Math.max(dtRef, 1 / 240);
    vy = (p.y - playerPrevPos.y) / Math.max(dtRef, 1 / 240);
  }
  playerPrevPos = { x: p.x, y: p.y };
  const sx = p.x - cam.x, sy = p.y - cam.y;

  // 主役の描画半径。当たり判定(p.r=13)はロジック側のまま、見た目の足元リングの
  // 大きさだけこれまでどおり拡大した値を基準にする。
  const drawR = p.r * 1.45;
  // 自機マーカー：群衆に埋もれても位置が分かるよう、足元に常時リングを置く
  // （chibi版：暗いタイル床に合わせて明るい緑 #7fd6a3 系へ変更）。
  ctx.save();
  ctx.strokeStyle = '#1f6b46';
  ctx.lineWidth = 5.5;
  ctx.beginPath();
  ctx.ellipse(sx, sy + drawR * 1.05, drawR * 1.1, drawR * 0.35, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(127,214,163,.9)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(sx, sy + drawR * 1.05, drawR * 1.1, drawR * 0.35, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 向き：撃った直後(AIM_HOLD秒以内)は狙い方向を優先し、背中から弾が出て見えないようにする。
  // それ以外は従来どおり速度ベース（速度が十分あれば向きを更新、ほぼ0なら直前の向きを保持）。
  const speed = Math.hypot(vx, vy);
  const aiming = lastAimAngle != null && (clock - lastAimT) <= AIM_HOLD;
  if (aiming) {
    playerFacingRow = pickFacingRow(lastAimAngle, playerFacingRow);
  } else if (speed > 4) {
    const ang = Math.atan2(vy, vx);
    playerFacingRow = pickFacingRow(ang, playerFacingRow);
  }
  const moving = speed > 4;
  // 2026-09-25: 新シートは「歩き2コマ」ではなく「待機1コマ＋歩き1コマ」なので、
  // 同じ拍(floor(t*6)%2)で列0(待機)⇔列1(歩き)を交互に出す。
  let spriteCol = moving ? (Math.floor(game.t * 6) % 2 === 0 ? SPRITE_IDLE_COL : SPRITE_WALK_COL) : SPRITE_IDLE_COL;
  // しゃぼんを撃った直後ATTACK_HOLD秒は攻撃コマ（'shot'イベント時刻=lastAimTを流用）。
  if (clock - lastAimT <= ATTACK_HOLD) spriteCol = SPRITE_ATTACK_COL;

  // 被弾演出：輪郭明滅の代わりに、スプライトを1フレームおきに描かない（点滅）
  // 点滅中に見えているコマは、シート列3の「目をつぶった顔」に差し替える（被弾が最優先）
  let showSprite = true;
  if (playerHurtT < FX_DUR.hurt) {
    showSprite = Math.floor(playerHurtT * 26) % 2 === 0;
    spriteCol = SPRITE_HURT_COL;
  }

  if (window.__spritesReady && showSprite) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    // セル下端がプレイヤーの足元に来るよう、リングの中に立って見える位置へ合わせる
    const dx = sx - SPRITE_DRAW / 2;
    const dy = sy + drawR * 0.9 - SPRITE_DRAW;
    ctx.drawImage(
      spriteImg,
      spriteCol * SPRITE_CELL, playerFacingRow * SPRITE_CELL, SPRITE_CELL, SPRITE_CELL,
      dx, dy, SPRITE_DRAW, SPRITE_DRAW,
    );
    ctx.restore();
  } else if (!window.__spritesReady) {
    // 画像読み込み前だけの保険（見失わないよう最低限の丸だけ出す）
    drawCreature(sx, sy, drawR, { angle: Math.PI / 2, along: 1, across: 1 }, COL.player.main, COL.player.shade, 0.4);
  }
}

/* 当たりの演出は自機の「下」に描く。加算合成の白が自機に乗ると位置を見失うため。 */
const FX_UNDER_PLAYER = new Set(['shot', 'hit', 'pop', 'gem', 'strike']);

let dtRef = 1 / 60;

/* 実画面へレターボックスでフィットさせる。
   論理 390x844 の外側はクリップで捨て、毎フレーム実画面全体をクリアする
   （そうしないと、W/H の外へはみ出して描かれた地面タイルや敵が消えずに残る）。 */
function drawSpeedButton() {
  const b = speedButton();
  const on = speedMul > 1;
  ctx.save();
  roundRect(b.x, b.y, b.w, b.h, 14);
  ctx.fillStyle = on ? '#3f9d68' : COL.panel;
  ctx.fill();
  ctx.strokeStyle = COL.panelBorder;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = on ? '#fffef8' : COL.ink;
  ctx.font = '700 17px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('\u00d7' + speedMul, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.restore();
}

function render() {
  ctx = mainCtx;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  ctx.save();
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  renderScene();
  ctx.restore();
}

function renderScene() {
  if (uiPhase === 'title' || !game) { window.__diag.hudBottom = 0; drawTitle(); return; }

  const cam = camera();

  // 世界パス：低解像度レイヤー(1ドット=論理2px)に描き、以降 mainCtx へ最近傍で拡大する。
  // 各描画関数の内部座標は無改造（setTransform(0.5,...)で吸収する）。
  ctx = lowCtx;
  ctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  drawGround(cam);
  drawStrikes(cam);
  drawGems(cam, false); // 遠くのかけら（縮小・落ち着いた色）。敵の下でよい
  for (const e of game.enemies) drawEnemy(e, cam);
  drawOrbiters(cam);
  drawProjectiles(cam);
  drawGems(cam, true); // 手元のかけら（拾える距離）。敵の後に描き、重なって隠れないようにする
  // 当たりの演出は自機の下
  const fxAlive = [];
  for (const fx of fxList) {
    if (!FX_UNDER_PLAYER.has(fx.name)) { fxAlive.push(fx); continue; }
    if (drawFxCombined(fx, fx.x - cam.x, fx.y - cam.y, clock - fx.t0)) fxAlive.push(fx);
  }
  drawPlayer(cam);
  // 自機自身の状態演出（levelup / hurt / boss / clear / heal）だけ自機の上
  fxList = fxAlive.filter((fx) => FX_UNDER_PLAYER.has(fx.name)
    ? true
    : drawFxCombined(fx, fx.x - cam.x, fx.y - cam.y, clock - fx.t0));
  ctx = mainCtx;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(lowCv, 0, 0, W / 2, H / 2, 0, 0, W, H);

  const hudBottom = drawHud();
  if (game.status === 'playing') drawSpeedButton();
  const bossBottom = drawBossUi(cam);
  window.__diag.hudBottom = bossBottom != null ? bossBottom : hudBottom;

  if (bossBanner > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, bossBanner);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    roundRect(W / 2 - 90, H / 2 - 130, 180, 40, 12);
    ctx.fill();
    ctx.fillStyle = COL.ink;
    ctx.font = '700 16px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('おやもち 出現！', W / 2, H / 2 - 110);
    ctx.restore();
  }

  if (game.status === 'levelup') drawLevelup();
  else if (game.status === 'gameover') drawEnd(false);
  else if (game.status === 'clear') drawEnd(true);
}

function drawTitle() {
  ctx.fillStyle = COL.groundA;
  ctx.fillRect(0, 0, W, H);

  // タイトル（上）
  ctx.fillStyle = COL.ink;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 30px -apple-system, sans-serif';
  ctx.fillText('ちびキャラ・サバイバーズ', W / 2, 200);
  ctx.font = '400 14px -apple-system, sans-serif';
  ctx.fillStyle = COL.inkSoft;
  ctx.fillText('ゆび1本で動かすだけ・8分', W / 2, 236);

  // 絵（中央）：主人公を大きく1体、その周りに敵を4体
  const titleDecor = [
    { x: 96,  y: 372, r: 16, key: 'poyo' },
    { x: 300, y: 386, r: 13, key: 'tsubu' },
    { x: 286, y: 492, r: 15, key: 'hane' },
    { x: 104, y: 496, r: 19, key: 'mochi' },
  ];
  for (const d of titleDecor) {
    if (window.__enemySpritesReady) {
      const sp = ENEMY_SPRITES[d.key];
      drawEnemySpriteScaled(loopFrame(sp.idle, d.x * 7 + d.y, 1.6), d.x, d.y, 4, false);
    } else {
      const anim = creatureAnim('title-' + d.key + d.x, d.x, d.y, 0, 0);
      const col = ENEMY_COLOR[d.key];
      drawCreature(d.x, d.y, d.r, anim, col.main, col.shade, 0.36);
    }
  }
  // 主人公はゲーム中と同じスプライトの正面（行2）を、1ドット=論理4pxで大きく出す。
  // キャラはセルの12〜39行目にいるので、その中ほど（26行目）が y=430 に来るよう置く。
  const TITLE_DOT = 4;
  const heroSize = SPRITE_CELL * TITLE_DOT;
  ctx.save();
  ctx.fillStyle = 'rgba(60,50,30,.16)';
  ctx.beginPath();
  ctx.ellipse(W / 2, 430 + 13 * TITLE_DOT, 11 * TITLE_DOT, 3 * TITLE_DOT, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  if (window.__spritesReady) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(
      spriteImg,
      0, 2 * SPRITE_CELL, SPRITE_CELL, SPRITE_CELL,
      Math.round(W / 2 - heroSize / 2), 430 - 26 * TITLE_DOT, heroSize, heroSize,
    );
    ctx.restore();
  }

  // むずかしさ：レベルアップのカードと同じ見た目に揃える
  for (const c of diffCards()) {
    const d = DIFFS[c.key];
    ctx.save();
    ctx.fillStyle = '#fffef8';
    ctx.strokeStyle = COL.panelBorder;
    ctx.lineWidth = 1;
    roundRect(c.x, c.y, c.w, c.h, 16);
    ctx.fill(); ctx.stroke();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '700 18px -apple-system, sans-serif';
    ctx.fillStyle = COL.ink;
    ctx.fillText(d.name, c.x + 20, c.y + 34);
    ctx.textAlign = 'right';
    ctx.font = '400 11.5px -apple-system, sans-serif';
    ctx.fillStyle = COL.inkSoft;
    ctx.fillText(d.tag, c.x + c.w - 20, c.y + 34);
    ctx.restore();
  }

  ctx.fillStyle = COL.inkSoft;
  ctx.textBaseline = 'alphabetic';
  ctx.font = '400 11px -apple-system, sans-serif';
  ctx.fillText('オフラインで動きます', W / 2, H - 40);

  ctx.textAlign = 'right';
  ctx.font = '400 10px -apple-system, sans-serif';
  ctx.fillText(VERSION, W - 14, H - 14);
}

function wrapText(text, maxWidth) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = ch; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawLevelup() {
  ctx.save();
  ctx.fillStyle = 'rgba(239,228,198,.93)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = COL.ink;
  ctx.font = '700 22px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const cards = levelupCards();
  const topY = cards.length ? cards[0].y - 40 : H / 2 - 40;
  ctx.fillText('レベルアップ！', W / 2, topY);

  // 空いた上側に自機を1体（2026-09-24 T-2c）。カードが上へ戻ってもHUD（下端98）
  // の裏に潜らないよう下限をクランプする（2026-09-24 再修正）。
  const heroY = cards.length ? Math.max(146, cards[0].y - 150) : H / 2 - 150;
  if (window.__spritesReady) {
    // 主人公スプライトの正面（行2・列0＝待機コマ）を1ドット=2論理pxで出す
    // （2026-09-25: drawCreature の丸いスライムから差し替え。当初1.2pxだったのを
    //  船長指摘で整数の2pxへ）。
    const dot = 2, size = SPRITE_CELL * dot;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(spriteImg, 0, 2 * SPRITE_CELL, SPRITE_CELL, SPRITE_CELL,
      Math.round(W / 2 - size / 2), Math.round(heroY - size * 0.62), size, size);
    ctx.restore();
  } else {
    const heroAnim = creatureAnim('levelup-hero', W / 2, heroY, 0, 0);
    drawCreature(W / 2, heroY, 24, heroAnim, COL.player.main, COL.player.shade, 0.4);
  }

  for (const c of cards) {
    ctx.save();
    ctx.fillStyle = '#fffef8';
    ctx.strokeStyle = COL.panelBorder;
    roundRect(c.x, c.y, c.w, c.h, 16);
    ctx.fill(); ctx.stroke();

    const isWeapon = !!WEAPONS[c.offer.key];

    // メダル（左のアイコン。2026-09-24 T-2a）
    const mcx = c.x + 44, mcy = c.y + c.h / 2;
    const view = OWNED_VIEW.find((o) => o.key === c.offer.key);
    const iconColor = view ? view.color : COL.inkSoft;
    const isFirst = c.offer.level <= 1;
    ctx.fillStyle = iconColor;
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(mcx, mcy, 26, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = isFirst ? '#e0b95c' : COL.panelBorder;
    ctx.lineWidth = isFirst ? 2.5 : 1;
    ctx.beginPath(); ctx.arc(mcx, mcy, 26, 0, Math.PI * 2); ctx.stroke();
    drawUpgradeIcon(mcx, mcy, c.offer.key, iconColor);

    // 1行目：名前 ＋ 種別タグ（左）／ 変化（右）
    ctx.textAlign = 'left';
    ctx.font = '700 17px -apple-system, sans-serif';
    ctx.fillStyle = COL.ink;
    ctx.fillText(c.offer.label, c.x + 82, c.y + 32);
    const labelW = ctx.measureText(c.offer.label).width;

    const tag = isWeapon ? 'ぶき' : 'からだ';
    ctx.font = '700 10px -apple-system, sans-serif';
    const tagW = ctx.measureText(tag).width + 14;
    roundRect(c.x + 82 + labelW + 10, c.y + 20, tagW, 16, 8);
    ctx.fillStyle = isWeapon ? 'rgba(63,157,104,.14)' : 'rgba(120,110,80,.13)';
    ctx.fill();
    ctx.fillStyle = isWeapon ? '#3f9d68' : COL.inkSoft;
    ctx.textAlign = 'center';
    ctx.fillText(tag, c.x + 82 + labelW + 10 + tagW / 2, c.y + 32);

    ctx.textAlign = 'right';
    ctx.font = '700 12px -apple-system, sans-serif';
    ctx.fillStyle = '#3f9d68';
    ctx.fillText(c.offer.level <= 1 ? 'はじめて' : ('Lv' + (c.offer.level - 1) + ' → ' + c.offer.level),
      c.x + c.w - 18, c.y + 32);

    // 2行目以降：説明（最大2行）
    ctx.textAlign = 'left';
    ctx.font = '400 13px -apple-system, sans-serif';
    ctx.fillStyle = COL.inkSoft;
    const lines = wrapText(c.offer.desc || '', c.w - 100);
    lines.slice(0, 2).forEach((ln, i) => ctx.fillText(ln, c.x + 82, c.y + 60 + i * 19));
    ctx.restore();
  }
  ctx.restore();
}

function drawEnd(cleared) {
  ctx.save();
  // 不透明で塗る（プレイヤーはカメラ追従でほぼ画面中央に居続けるため、
  // 半透明だと文字と重なって見えてしまう）
  ctx.fillStyle = COL.groundA;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = COL.ink;
  ctx.font = '700 26px -apple-system, sans-serif';
  ctx.fillText(cleared ? 'クリア！' : 'ゲームオーバー', W / 2, H / 2 - 60);

  ctx.font = '400 14px -apple-system, sans-serif';
  ctx.fillStyle = COL.inkSoft;
  const p = game.player;
  ctx.fillText(DIFFS[game.diffKey].name + '　生存時間 ' + fmtTime(game.t), W / 2, H / 2 - 20);
  ctx.fillText('レベル ' + p.level + ' ・ 撃破数 ' + game.kills, W / 2, H / 2 + 4);

  roundRect(W / 2 - 100, H / 2 + 70, 200, 60, 18);
  ctx.fillStyle = '#3f9d68';
  ctx.fill();
  ctx.fillStyle = '#fffef8';
  ctx.font = '700 17px -apple-system, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText('もういちど', W / 2, H / 2 + 100);
  ctx.restore();
}

/* =========================================================================
   メインループ
   ========================================================================= */
let lastTs = null;
function loop(ts) {
  requestAnimationFrame(loop);
  if (lastTs == null) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 1 / 30); // §9：描画側でもクランプする
  dtRef = dt || dtRef;

  if (uiPhase === 'play' && game) {
    // BASE_SPEED（基本速度1.3倍）: dt は変えず、繰り越しで1フレームあたり平均1.3回
    // advanceFrame を呼ぶ（advanceFrame 自体は無改変。speedMul の×2/×3はその内側で従来どおり掛かる）。
    stepAccum += BASE_SPEED;
    const outerSteps = Math.floor(stepAccum);
    stepAccum -= outerSteps;
    let ran = 0; // advanceFrame の中で実際に stepGame が呼ばれた回数
    for (let o = 0; o < outerSteps; o++) {
      if (game.status !== 'playing') break;
      // dt は変えず、同じ dt で stepGame を speedMul 回呼ぶ（speed-control.js）
      advanceFrame(game, dt, speedMul, () => {
        input = currentInput();
        prevStatus = game.status;
        return input;
      }, () => {
        handleEvents(drainEvents(game));
        clock += dt; // 実際に stepGame を呼んだ回数ぶんだけ演出時間を加算
        if (playerHurtT < 999) playerHurtT += dt;
        if (bossBanner > 0) bossBanner -= dt;
        // player の速度算出用に前フレーム座標を保持
        entPrev.set('player', { x: game.player.x, y: game.player.y, angle: entPrev.get('player')?.angle ?? Math.PI / 2 });
        ran++;
      });
    }
    if (ran === 0) clock += dt; // playing 以外で1回も進まなかった間も演出用の時計は進める
  } else {
    clock += dt; // ゲーム進行中でない間も演出用の時計は進める
  }
  render();
}
requestAnimationFrame(loop);

/* =========================================================================
   デバッグ用（ヘッドレス確認で使う。tidal-garden.html と同じ流儀）
   ========================================================================= */
window.__diag = {
  hudBottom: 0, // その回のrender()で実際に描いたHUDの最下端（論理px）。renderScene()内で毎フレーム上書きする
  get cam() { return game ? camera() : null; },
  get clock() { return clock; },
  get game() { return game; },
  get speedMul() { return speedMul; },
  // 自機の向き（スプライトの行番号 0=右 1=右下 2=下 3=左下 4=左 5=左上 6=上 7=右上）。
  // 斜め入力で向きが往復していないかをヘッドレスで数えるために出している。
  get facing() { return playerFacingRow; },
  get lastAimT() { return lastAimT; }, // 攻撃コマの受入確認用（2026-09-25）
  setSpeed(v) { speedMul = normalizeSpeed(v); return speedMul; },
  step(n = 1, dt = 1 / 60) {
    if (uiPhase !== 'play') startRun();
    for (let i = 0; i < n; i++) {
      input = currentInput();
      stepGame(game, dt, input);
      handleEvents(drainEvents(game));
      clock += dt;
      if (playerHurtT < 999) playerHurtT += dt;
      if (bossBanner > 0) bossBanner -= dt;
      entPrev.set('player', { x: game.player.x, y: game.player.y, angle: entPrev.get('player')?.angle ?? Math.PI / 2 });
    }
    render();
    return { status: game.status, t: game.t, enemies: game.enemies.length, hp: game.player.hp };
  },
  shot() { return cv.toDataURL('image/png'); },
  startRun,
  setInput(mx, my) { input = { mx, my }; },
};
</script>
