<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#bfe6f5">
<title>スライム・イン・かご</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0e1a24;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #cv { display:block; position:fixed; inset:0; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";

/* ===== 論理座標（縦長） ===== */
const W = 400, H = 700;
const GROUND = H - 96;          // 地面のライン
const G = 1600;                 // 重力 px/s^2
const ANG = Math.PI / 3;        // 打ち出し角 60°
const VMIN = 520, VMAX = 840;   // 押し時間 -> 初速
const CHARGE_MS = 800;          // 満タンまでの押し時間
const PAD_X = 62;               // 発射台
const R = 15;                   // スライム半径

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, cssW = 0, cssH = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const r = cv.getBoundingClientRect();
  cssW = Math.max(1, Math.round(r.width));
  cssH = Math.max(1, Math.round(r.height));
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  scale = Math.min(cssW / W, cssH / H);
  offX = (cssW - W * scale) / 2;
  offY = (cssH - H * scale) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function checkResize() {
  const r = cv.getBoundingClientRect();
  if (Math.round(r.width) !== cssW || Math.round(r.height) !== cssH) resize();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

/* ===== 音（WebAudio・簡易） ===== */
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function beep(freq, dur, type, vol, slideTo) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol || 0.14, a.currentTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
const S = {
  launch: () => beep(300, 0.18, 'triangle', 0.12, 700),
  score:  () => { beep(660, 0.10, 'sine', 0.16); setTimeout(() => beep(880, 0.14, 'sine', 0.16), 90); setTimeout(() => beep(1180, 0.20, 'sine', 0.13), 190); },
  miss:   () => beep(150, 0.22, 'sawtooth', 0.10, 70),
  bonk:   () => beep(220, 0.08, 'square', 0.08, 140),
  over:   () => { beep(400, 0.2, 'triangle', 0.14, 300); setTimeout(() => beep(280, 0.35, 'triangle', 0.13, 150), 200); }
};

/* ===== ゲーム状態 ===== */
const BEST_KEY = 'slime_basket_best';
let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;

let state, score, lives, combo, charging, chargeT, t, shake, msg, msgT, overT;
let slime, basket, parts, clouds, stack, popups;

function initClouds() {
  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({ x: Math.random() * W, y: 60 + Math.random() * 220, s: 0.6 + Math.random() * 0.8, v: 4 + Math.random() * 8 });
  }
}

function resetGame() {
  state = 'ready';
  score = 0; lives = 3; combo = 0;
  charging = false; chargeT = 0; t = 0; shake = 0;
  msg = 'ながおし＝大ジャンプ'; msgT = 3;
  overT = 0;
  parts = []; stack = []; popups = [];
  basket = { cx: 250, rimY: GROUND - 88, baseY: GROUND - 88, phase: Math.random() * Math.PI * 2 };
  initClouds();
  resetSlime();
}

function resetSlime() {
  slime = { x: PAD_X, y: GROUND - R, vx: 0, vy: 0, sq: 0, rot: 0, alive: true, inBasket: false };
  state = 'ready';
  charging = false; chargeT = 0;
}

function level() { return Math.floor(score / 3); }

/* ===== 入力 ===== */
function pressStart() {
  audio();
  if (state === 'gameover') { if (overT > 0.7) resetGame(); return; }
  if (state !== 'ready') return;
  charging = true; chargeT = 0;
}
function pressEnd() {
  if (state === 'gameover') return;
  if (!charging || state !== 'ready') { charging = false; return; }
  charging = false;
  const p = Math.min(chargeT * 1000 / CHARGE_MS, 1);
  const v = VMIN + (VMAX - VMIN) * p;
  slime.vx = Math.cos(ANG) * v;
  slime.vy = -Math.sin(ANG) * v;
  slime.sq = -0.35;
  state = 'flying';
  S.launch();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); pressStart(); }, { passive: false });
window.addEventListener('pointerup', e => { pressEnd(); }, { passive: true });
window.addEventListener('pointercancel', () => { pressEnd(); }, { passive: true });
window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); pressStart(); } }, { passive: false });
window.addEventListener('keyup', e => { if (e.code === 'Space') { e.preventDefault(); pressEnd(); } }, { passive: false });
window.addEventListener('contextmenu', e => e.preventDefault());

/* ===== かご ===== */
const BW = 80, BW2 = 60, BD = 58;   // 上幅・下幅・深さ

function updateBasket(dt) {
  const lv = level();
  const spd = 1.05 + Math.min(lv, 7) * 0.14;   // 難度は頭打ちにする（理不尽にしない）
  const amp = 92 + Math.min(lv * 9, 46);
  basket.phase += dt * spd;
  const cxMin = 145, cxMax = W - 46;
  const mid = (cxMin + cxMax) / 2;
  basket.cx = mid + Math.sin(basket.phase) * Math.min(amp, (cxMax - cxMin) / 2);
  if (lv >= 2) basket.rimY = basket.baseY + Math.sin(basket.phase * 0.73) * (14 + Math.min(lv * 6, 26));
  else basket.rimY = basket.baseY;
}

/* ===== パーティクル ===== */
function burst(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, r: 2 + Math.random() * 3, life: 0.5 + Math.random() * 0.4, max: 0.9, col });
  }
}
function popup(x, y, text, col) { popups.push({ x, y, text, col, life: 1.0 }); }

/* ===== 更新 ===== */
function update(dt) {
  t += dt;
  shake = Math.max(0, shake - dt * 4);
  msgT = Math.max(0, msgT - dt);
  for (const c of clouds) { c.x += c.v * dt * 0.3; if (c.x > W + 60) c.x = -60; }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += G * 0.5 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const q = popups[i]; q.life -= dt * 1.1; q.y -= 34 * dt;
    if (q.life <= 0) popups.splice(i, 1);
  }

  if (state === 'gameover') { overT += dt; updateBasket(dt * 0.3); return; }

  updateBasket(dt);

  if (state === 'ready') {
    if (charging) {
      chargeT += dt;
      const p = Math.min(chargeT * 1000 / CHARGE_MS, 1);
      slime.sq = 0.10 + p * 0.22;
    } else {
      slime.sq += (Math.sin(t * 5) * 0.05 - slime.sq) * Math.min(1, dt * 8);
    }
    slime.y = GROUND - R * (1 - slime.sq);
    return;
  }

  if (state === 'flying') {
    const py = slime.y;
    slime.vy += G * dt;
    slime.x += slime.vx * dt;
    slime.y += slime.vy * dt;
    slime.sq += (Math.max(-0.25, Math.min(0.25, slime.vy / 2600)) - slime.sq) * Math.min(1, dt * 9);

    // 落下中：かごの口を通過したか
    const rim = basket.rimY;
    const halfIn = BW / 2 - 7, half = BW / 2;
    const dx = slime.x - basket.cx, sgn = Math.sign(dx) || 1;
    if (slime.vy > 0 && py <= rim && slime.y >= rim) {
      if (Math.abs(dx) < halfIn) { onScore(); return; }
      if (Math.abs(dx) < half + R) {           // ふちに当たって弾かれる
        slime.y = rim - 2;
        slime.vy = -Math.abs(slime.vy) * 0.34;
        slime.vx = Math.abs(slime.vx) * 0.45 * sgn;
        S.bonk(); shake = 0.5;
        burst(slime.x, rim, 7, '#d8f0a0', 130);
      }
    } else if (slime.y > rim + 8 && slime.y < rim + BD &&
               Math.abs(dx) < half + R && Math.abs(dx) > halfIn) {   // 横腹に当たった
      slime.x = basket.cx + sgn * (half + R);
      slime.vx = Math.abs(slime.vx) * 0.35 * sgn;
      slime.vy *= 0.5;
      S.bonk(); shake = 0.4;
      burst(slime.x, slime.y, 6, '#d8f0a0', 130);
    }
    // 地面
    if (slime.y + R >= GROUND) { onMiss(); return; }
    // 画面外
    if (slime.x > W + 40) { onMiss(); return; }
    return;
  }

  if (state === 'scored' || state === 'missed') {
    slime.sq += (0 - slime.sq) * Math.min(1, dt * 6);
    if (t - stateT > 0.75) {
      if (lives <= 0) { state = 'gameover'; overT = 0; S.over(); if (score > best) { best = score; localStorage.setItem(BEST_KEY, String(best)); } }
      else resetSlime();
    }
  }
}

let stateT = 0;
function onScore() {
  score++; combo++;
  stack.push({ ox: (Math.random() - 0.5) * 34, oy: -Math.random() * 8, hue: Math.random() * 40 - 20 });
  if (stack.length > 6) stack.shift();
  burst(basket.cx, basket.rimY, 18, '#ffe27a', 200);
  popup(basket.cx, basket.rimY - 30, combo >= 3 ? ('ナイス！ x' + combo) : 'ナイス！', '#2b6d3f');
  msg = ''; shake = 0.4;
  S.score();
  state = 'scored'; stateT = t;
  slime.inBasket = true;
}
function onMiss() {
  lives--; combo = 0;
  slime.y = GROUND - R * 0.55; slime.sq = 0.45;
  burst(slime.x, GROUND - 4, 12, '#9fd7ef', 150);
  popup(slime.x, GROUND - 60, 'おっと…', '#8a4a4a');
  shake = 0.6; S.miss();
  state = 'missed'; stateT = t;
}

/* ===== 描画 ===== */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawSlime(x, y, r, sq, body, dark) {
  const rx = r * (1 + sq * 0.9), ry = r * (1 - sq * 0.9);
  const by = y + ry;
  // 影
  ctx.fillStyle = 'rgba(20,50,60,0.13)';
  ctx.beginPath(); ctx.ellipse(x, GROUND - 2, rx * 0.95, 5, 0, 0, Math.PI * 2); ctx.fill();
  // 体
  ctx.beginPath();
  ctx.moveTo(x - rx, by);
  ctx.bezierCurveTo(x - rx, by - ry * 2.55, x + rx, by - ry * 2.55, x + rx, by);
  ctx.closePath();
  const g = ctx.createLinearGradient(x, by - ry * 2, x, by);
  g.addColorStop(0, body); g.addColorStop(1, dark);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(30,90,110,0.28)'; ctx.lineWidth = 1.4; ctx.stroke();
  // ハイライト
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.beginPath(); ctx.ellipse(x - rx * 0.35, by - ry * 1.35, rx * 0.20, ry * 0.30, -0.4, 0, Math.PI * 2); ctx.fill();
  // 目
  ctx.fillStyle = '#123';
  const ey = by - ry * 0.85, ex = rx * 0.32;
  ctx.beginPath(); ctx.ellipse(x - ex, ey, 2.3, 3.0, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + ex, ey, 2.3, 3.0, 0, 0, Math.PI * 2); ctx.fill();
  // 口
  ctx.strokeStyle = '#123'; ctx.lineWidth = 1.3; ctx.beginPath();
  ctx.arc(x, ey + 3.2, 3.0, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
}

function drawBasketBack() {
  const cx = basket.cx, ry = basket.rimY;
  // 影
  ctx.fillStyle = 'rgba(20,50,60,0.12)';
  ctx.beginPath(); ctx.ellipse(cx, GROUND - 2, BW / 2 * 0.8, 6, 0, 0, Math.PI * 2); ctx.fill();
  // 支柱
  ctx.strokeStyle = 'rgba(120,95,60,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, ry + BD); ctx.lineTo(cx, GROUND - 2); ctx.stroke();
  // 口の楕円（奥）
  ctx.fillStyle = '#5b3d22';
  ctx.beginPath(); ctx.ellipse(cx, ry, BW / 2, 12, 0, 0, Math.PI * 2); ctx.fill();
  // 本体
  ctx.beginPath();
  ctx.moveTo(cx - BW / 2, ry);
  ctx.lineTo(cx - BW2 / 2, ry + BD);
  ctx.quadraticCurveTo(cx, ry + BD + 12, cx + BW2 / 2, ry + BD);
  ctx.lineTo(cx + BW / 2, ry);
  ctx.closePath();
  const g = ctx.createLinearGradient(cx - BW / 2, 0, cx + BW / 2, 0);
  g.addColorStop(0, '#a9763f'); g.addColorStop(0.45, '#d8a566'); g.addColorStop(1, '#95662f');
  ctx.fillStyle = g; ctx.fill();
  // 編み目
  ctx.strokeStyle = 'rgba(90,60,25,0.35)'; ctx.lineWidth = 1.2;
  for (let i = 1; i < 4; i++) {
    const yy = ry + (BD * i) / 4;
    const k = 1 - (i / 4) * ((BW - BW2) / BW);
    ctx.beginPath(); ctx.moveTo(cx - (BW / 2) * k, yy); ctx.quadraticCurveTo(cx, yy + 5, cx + (BW / 2) * k, yy); ctx.stroke();
  }
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(cx + i * (BW / 5), ry + 2); ctx.lineTo(cx + i * (BW2 / 5), ry + BD); ctx.stroke();
  }
}

function drawBasketFront() {
  const cx = basket.cx, ry = basket.rimY;
  // たまったスライム
  for (let i = 0; i < stack.length; i++) {
    const s = stack[i];
    drawStackSlime(cx + s.ox, ry + 16 + s.oy + i * 1.5, 9);
  }
  // 手前のふち
  ctx.strokeStyle = '#c9924f'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(cx, ry, BW / 2, 12, 0, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = '#e8bd7d'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, ry, BW / 2, 12, 0, Math.PI, Math.PI * 2); ctx.stroke();
  ctx.lineCap = 'butt';
}

function drawStackSlime(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x - r, y);
  ctx.bezierCurveTo(x - r, y - r * 2.2, x + r, y - r * 2.2, x + r, y);
  ctx.closePath();
  ctx.fillStyle = '#7fd4a8'; ctx.fill();
  ctx.fillStyle = '#123';
  ctx.beginPath(); ctx.ellipse(x - 3, y - r * 0.8, 1.4, 1.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 3, y - r * 0.8, 1.4, 1.8, 0, 0, Math.PI * 2); ctx.fill();
}

function drawGuide() {
  const p = Math.min(chargeT * 1000 / CHARGE_MS, 1);
  const v = VMIN + (VMAX - VMIN) * p;
  const vx = Math.cos(ANG) * v, vy = -Math.sin(ANG) * v;
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  for (let i = 1; i <= 7; i++) {
    const tt = i * 0.055;
    const x = PAD_X + vx * tt, y = (GROUND - R) + vy * tt + 0.5 * G * tt * tt;
    ctx.beginPath(); ctx.arc(x, y, 3.2 - i * 0.22, 0, Math.PI * 2); ctx.fill();
  }
}

function drawMeter() {
  const p = Math.min(chargeT * 1000 / CHARGE_MS, 1);
  const bx = 22, by = GROUND - 150, bw = 12, bh = 130;
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; rr(bx, by, bw, bh, 6); ctx.fill();
  const hgt = bh * p;
  const g = ctx.createLinearGradient(0, by + bh, 0, by);
  g.addColorStop(0, '#7fd4a8'); g.addColorStop(0.6, '#ffd166'); g.addColorStop(1, '#ff6b6b');
  ctx.fillStyle = g; rr(bx, by + bh - hgt, bw, hgt, 6); ctx.fill();
  if (p >= 1) { ctx.strokeStyle = 'rgba(255,90,90,' + (0.5 + 0.5 * Math.sin(t * 20)) + ')'; ctx.lineWidth = 2.5; rr(bx - 2, by - 2, bw + 4, bh + 4, 8); ctx.stroke(); }
}

function drawHUD() {
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#20404d';
  ctx.font = 'bold 30px -apple-system, "Hiragino Sans", sans-serif';
  ctx.fillText(String(score), 18, 16);
  ctx.font = '13px -apple-system, "Hiragino Sans", sans-serif';
  ctx.fillStyle = '#5a7b86';
  ctx.fillText('こ　　BEST ' + best, 18 + ctx.measureText(String(score)).width + 24, 27);
  // ライフ
  for (let i = 0; i < 3; i++) {
    const x = W - 30 - i * 25, y = 32;
    ctx.globalAlpha = i < lives ? 1 : 0.22;
    drawStackSlime(x, y, 9);
    ctx.globalAlpha = 1;
  }
  if (msgT > 0 && msg) {
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, msgT);
    ctx.fillStyle = 'rgba(32,64,77,0.85)';
    ctx.font = 'bold 17px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillText(msg, W / 2, 92);
    ctx.font = '13px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillText('みじかく押す＝小ジャンプ', W / 2, 116);
    ctx.globalAlpha = 1;
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(14,26,36,' + Math.min(0.62, overT * 1.2) + ')';
  ctx.fillRect(0, 0, W, H);
  if (overT < 0.25) return;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 34px -apple-system, "Hiragino Sans", sans-serif';
  ctx.fillText('おしまい', W / 2, H / 2 - 70);
  ctx.font = 'bold 56px -apple-system, "Hiragino Sans", sans-serif';
  ctx.fillStyle = '#ffe27a';
  ctx.fillText(score + ' こ', W / 2, H / 2);
  ctx.font = '16px -apple-system, "Hiragino Sans", sans-serif';
  ctx.fillStyle = '#cfe7f0';
  ctx.fillText('BEST ' + best + ' こ', W / 2, H / 2 + 46);
  if (overT > 0.7) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 4);
    ctx.font = 'bold 18px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('タップでもう一回', W / 2, H / 2 + 110);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.save();
  ctx.clearRect(0, 0, cssW, cssH);
  // 余白（レターボックス）
  ctx.fillStyle = '#0e1a24'; ctx.fillRect(0, 0, cssW, cssH);
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const sx = shake > 0 ? (Math.random() - 0.5) * shake * 8 : 0;
  const sy = shake > 0 ? (Math.random() - 0.5) * shake * 8 : 0;
  ctx.translate(sx, sy);

  // 空
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#bfe6f5'); sky.addColorStop(1, '#e8f7f2');
  ctx.fillStyle = sky; ctx.fillRect(-10, -10, W + 20, GROUND + 20);
  // 雲
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  for (const c of clouds) {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 34 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x - 24 * c.s, c.y + 5 * c.s, 20 * c.s, 11 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x + 26 * c.s, c.y + 5 * c.s, 22 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // 遠景の丘
  ctx.fillStyle = '#cdeacb';
  ctx.beginPath(); ctx.ellipse(90, GROUND + 30, 150, 70, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(330, GROUND + 40, 170, 80, 0, 0, Math.PI * 2); ctx.fill();
  // 地面
  const gr = ctx.createLinearGradient(0, GROUND, 0, H);
  gr.addColorStop(0, '#8fd08a'); gr.addColorStop(1, '#5fae66');
  ctx.fillStyle = gr; ctx.fillRect(-10, GROUND, W + 20, H - GROUND + 10);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-10, GROUND + 1.5); ctx.lineTo(W + 10, GROUND + 1.5); ctx.stroke();
  // 草
  ctx.strokeStyle = 'rgba(60,140,80,0.45)'; ctx.lineWidth = 2;
  for (let i = 0; i < 22; i++) {
    const x = ((i * 53) % (W + 20)) - 10, h = 6 + ((i * 17) % 9);
    ctx.beginPath(); ctx.moveTo(x, GROUND + 12); ctx.quadraticCurveTo(x + 3, GROUND + 12 - h, x + 6, GROUND + 12 - h + 2); ctx.stroke();
  }
  // 発射台
  ctx.fillStyle = '#c98b5a'; rr(PAD_X - 26, GROUND - 6, 52, 12, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; rr(PAD_X - 22, GROUND - 4, 44, 4, 2); ctx.fill();

  drawBasketBack();

  // スライム（かごに入ったら描かない）
  if (!(state === 'scored')) drawSlime(slime.x, slime.y, R, slime.sq, '#8fe3c0', '#4fbf9a');

  drawBasketFront();

  // パーティクル
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // ポップアップ
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const q of popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life));
    ctx.font = 'bold 20px -apple-system, "Hiragino Sans", sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.col; ctx.fillText(q.text, q.x, q.y);
  }
  ctx.globalAlpha = 1;

  if (state === 'ready' && charging) { drawGuide(); drawMeter(); }
  drawHUD();
  if (state === 'gameover') drawGameOver();

  ctx.restore();
}

/* ===== ループ ===== */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  checkResize();
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
resetGame();
requestAnimationFrame(frame);
</script>
