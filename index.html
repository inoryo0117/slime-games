<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fffaf2">
<link rel="icon" href="data:,">
<title>スライムのゲーム置き場</title>
<meta name="description" content="ダウンロード不要・登録不要。スマホでもPCでも、開いたらすぐ遊べる短時間のブラウザゲーム。">
<meta property="og:type" content="website">
<meta property="og:title" content="スライムのゲーム置き場">
<meta property="og:description" content="ダウンロード不要・登録不要。スマホでもPCでも、開いたらすぐ遊べる短時間のブラウザゲーム。">
<meta property="og:image" content="https://inoryo0117.github.io/slime-games/img/ogp.png">
<meta property="og:url" content="https://inoryo0117.github.io/slime-games/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg:#fffaf2; --text:#23303f; --sub:#5d6b7c; --line:#e6dccb; --accent:#3f9d68; --card:#fff;
    --font-head:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c",system-ui;
    --font-body:"Hiragino Sans","Yu Gothic",system-ui;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.6; }
  a { color:inherit; }

  /* 一覧 */
  .wrap { max-width:1200px; margin:0 auto; padding:calc(32px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  header h1 { font-family:var(--font-head); font-size:28px; line-height:1.3; }
  header p { color:var(--sub); font-size:14px; margin-top:8px; }
  .tags { display:flex; flex-wrap:wrap; gap:8px; margin:24px 0; }
  .tags button { font:inherit; font-family:var(--font-body); font-size:15px; font-weight:500; line-height:20px; height:36px; padding:0 16px;
    background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:999px; cursor:pointer; }
  .tags button[aria-pressed="true"] { background:var(--text); border-color:var(--text); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:24px; }
  .card { display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    text-decoration:none; box-shadow:0 1px 2px rgba(35,48,63,.06); }
  .thumb { aspect-ratio:16/10; overflow:hidden; background:var(--line); }
  .thumb img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .15s ease; }
  .card:hover .thumb img, .card:focus-visible .thumb img { transform:translateY(-4px) scale(1.03); }
  .card:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
  .body { padding:16px; display:flex; flex-direction:column; flex:1; }
  .body h2 { font-family:var(--font-head); font-size:18px; line-height:1.4; }
  .body .catch { color:var(--sub); font-size:14px; margin-top:8px; flex:1; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:16px; }
  .meta .t { font-size:12px; color:var(--sub); border:1px solid var(--line); border-radius:999px; padding:0 8px; }
  .meta .ext { font-size:12px; color:var(--text); background:var(--line); border-radius:4px; padding:0 8px; }
  .meta .cnt { font-size:13px; color:#5d6b7c; }
  .play { margin-left:auto; font-family:var(--font-head); font-size:19px; font-weight:700; line-height:24px; background:var(--accent); color:#fff; border-radius:8px; padding:8px 16px; }
  footer { margin-top:48px; padding-top:24px; border-top:1px solid var(--line); color:var(--sub); font-size:12px; line-height:2; }

  /* プレイ画面 */
  .player { position:fixed; inset:0; display:flex; flex-direction:column; height:100dvh; background:#000; }
  .bar { flex:none; display:flex; align-items:center; gap:16px; height:calc(40px + env(safe-area-inset-top)); padding:env(safe-area-inset-top) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));
    background:var(--bg); border-bottom:1px solid var(--line); }
  .bar a, .bar button { font:inherit; font-size:14px; color:var(--text); background:none; border:0; padding:8px; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .bar .title { flex:1; text-align:center; font-family:var(--font-head); font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .frame { flex:1; min-height:0; }
  .frame iframe { display:block; width:100%; height:100%; border:0; background:var(--bg); }
</style>
</head>
<body>
<div id="app"></div>
<noscript>
  <div class="wrap">
    <header><h1>スライムのゲーム置き場</h1><p>JavaScript を有効にすると一覧が表示されます。直接のリンクはこちら。</p></header>
    <ul style="margin-top:24px;padding-left:24px">
      <li><a href="slime-survivors.html">スライム・サバイバーズ</a></li>
      <li><a href="chibi-survivors.html">ちびキャラ・サバイバーズ</a></li>
      <li><a href="slime-tower.html">スライム防衛隊タワーディフェンス</a></li>
      <li><a href="slime-basket.html">スライム・イン・かご</a></li>
      <li><a href="https://inoryo0117.github.io/piano-game/">おとふる（外部リンク）</a></li>
    </ul>
  </div>
</noscript>

<script>
/* ================================================================
   編集するのはここだけ
   ================================================================ */
/* 遊ばれた回数を数えたいときだけ、Google Apps Script のウェブアプリの URL（…/exec）をここに貼る。
   手順は counter.gs の先頭コメントを参照。空のままなら外部への通信は一切しない。 */
var COUNTER_URL = "";

const SITE = {
  name: "スライムのゲーム置き場",
  lead: "ダウンロードも登録もなし。開いたらすぐ遊べます。",
};

/* 新作を足すには、下の1件をコピーして GAMES の先頭か末尾に貼り、書き換える。
   並びは「サイト内ゲーム→外部リンク」の順で、それぞれ date の新しい順に自動で決まる。
   { id: "半角英数とハイフン（URLに使う・重複不可）",
     title: "タイトル", date: "YYYY-MM-DD", tags: ["タグ", ...], catch: "ひとこと",
     img: "img/games/<id>.webp",            // サムネ 16:10（1280x800 など）
     play: "xxx.html" }                     // このサイト内のHTML → プレイ画面で開く
   外部サイトなら play の代わりに  url: "https://..."  と書く（別タブで開く）。 */
const GAMES = [
  { id:"slime-survivors", title:"スライム・サバイバーズ", date:"2026-09-24", tags:["アクション"],
    catch:"見下ろし視点でひたすら逃げまわる自動攻撃サバイバー。ゆび1本で動かすだけ、8分間生き延びろ。",
    img:"img/games/slime-survivors.webp", play:"slime-survivors.html" },
  { id:"chibi-survivors", title:"ちびキャラ・サバイバーズ", date:"2026-09-24", tags:["アクション"],
    catch:"主人公を8方向に歩くドット絵のちびキャラにした版。ルールは同じ、ゆび1本で8分間。",
    img:"img/games/chibi-survivors.webp", play:"chibi-survivors.html" },
  { id:"slime-tower", title:"スライム防衛隊タワーディフェンス", date:"2026-09-24", tags:["タワーディフェンス"],
    catch:"道の脇のマスをタップしてタワーを建設。乗り物・戦車・飛行機を迎え撃ち、全4面を守りきれ。",
    img:"img/games/slime-tower.webp", play:"slime-tower.html" },
  { id:"slime-basket", title:"スライム・イン・かご", date:"2026-09-24", tags:["スコアアタック"],
    catch:"動くかごに何匹入れられるか。3回落としたら終わり。ベスト更新を狙う短時間版。",
    img:"img/games/slime-basket.webp", play:"slime-basket.html" },
  { id:"piano-game", title:"おとふる（ピアノ音ゲー）", date:"2026-09-26", tags:["音ゲー"],
    catch:"iPad と本物のピアノで遊ぶ音ゲー。降ってくる音を弾いていく。",
    img:"img/games/piano-game.webp", url:"https://inoryo0117.github.io/piano-game/" },
];
/* ================================================================ */

const app = document.getElementById("app");

/* ---- 遊んだ回数（COUNTER_URL が空なら何もしない）---- */
let countsPromise = null;
function fetchCounts() {
  if (!COUNTER_URL) return Promise.resolve(null);
  if (!countsPromise) {
    countsPromise = fetch(COUNTER_URL, { credentials:"omit", redirect:"follow" })
      .then(r => r.ok ? r.json() : null).catch(() => null);
  }
  return countsPromise;
}
function sendHit(id) {
  if (!COUNTER_URL) return;
  const key = "hit:" + id;
  try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, "1"); } catch (e) { return; }
  fetch(COUNTER_URL + (COUNTER_URL.includes("?") ? "&" : "?") + "hit=" + encodeURIComponent(id),
    { credentials:"omit", redirect:"follow" }).then(r => r.text()).catch(() => {});
}
let activeTag = "";

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
  }
  kids.forEach(c => e.append(c));
  return e;
}

function renderList() {
  document.title = SITE.name;
  const tags = [...new Set(GAMES.flatMap(g => g.tags))];
  const sorted = [...GAMES].sort((a, b) => (!!a.url - !!b.url) || b.date.localeCompare(a.date));

  const tagBar = el("div", { class:"tags", role:"group", "aria-label":"タグで絞り込む" });
  ["", ...tags].forEach(t => {
    const b = el("button", { type:"button", "aria-pressed": String(t === activeTag) }, t || "すべて");
    b.onclick = () => { activeTag = t; renderList(); };
    tagBar.append(b);
  });

  const grid = el("div", { class:"grid" });
  sorted.filter(g => !activeTag || g.tags.includes(activeTag)).forEach(g => {
    const external = !!g.url;
    const a = el("a", { class:"card", href: external ? g.url : "#/play/" + g.id });
    if (external) { a.target = "_blank"; a.rel = "noopener"; }
    const img = el("img", { src:g.img, alt:"", loading:"lazy", width:"1280", height:"800" });
    const meta = el("div", { class:"meta" });
    g.tags.forEach(t => meta.append(el("span", { class:"t" }, t)));
    if (external) meta.append(el("span", { class:"ext" }, "外部サイト"));
    if (!external && COUNTER_URL) meta.append(el("span", { class:"cnt", "data-id":g.id }));
    meta.append(el("span", { class:"play" }, "あそぶ"));
    a.append(
      el("div", { class:"thumb" }, img),
      el("div", { class:"body" }, el("h2", null, g.title), el("p", { class:"catch" }, g.catch), meta)
    );
    grid.append(a);
  });

  const credit = el("footer");
  credit.innerHTML = 'ホーム画面に追加すると全画面になります<br>' +
    (COUNTER_URL ? '遊んだ回数を数えるため Google に通信します（ゲーム名だけ・個人情報は送りません）。オフラインでもゲームは遊べます'
                 : '外部通信なし・オフラインでも動きます（「外部サイト」と書かれたゲームを除く）') + '<br>' +
    'タワーディフェンスの画像素材は <a href="https://kenney.nl/assets/tower-defense-top-down">Kenney</a>（CC0）';

  app.replaceChildren(el("div", { class:"wrap" },
    el("header", null, el("h1", null, SITE.name), el("p", null, SITE.lead)), tagBar, grid, credit));

  if (COUNTER_URL) fetchCounts().then(c => {
    if (!c || typeof c !== "object") return;
    grid.querySelectorAll(".cnt").forEach(n => {
      const v = Number(c[n.dataset.id]);
      if (Number.isFinite(v) && v > 0) n.textContent = v.toLocaleString() + "回あそばれた";
    });
  });
}

function renderPlay(id) {
  const g = GAMES.find(x => x.id === id && x.play);
  if (!g) { location.replace("#/"); return; }
  document.title = g.title + " - " + SITE.name;
  sendHit(g.id);

  const back = el("a", { href:"#/" }, "← 一覧へ戻る");
  const bar = el("div", { class:"bar" }, back, el("span", { class:"title" }, g.title));
  const frame = el("div", { class:"frame" });
  const iframe = el("iframe", { src:g.play, title:g.title, allow:"fullscreen; autoplay" });
  iframe.allowFullscreen = true;
  iframe.addEventListener("load", () => { try { iframe.contentWindow.focus(); } catch (e) {} });
  frame.append(iframe);
  if (document.fullscreenEnabled) {
    const fs = el("button", { type:"button" }, "全画面");
    fs.onclick = () => { (document.fullscreenElement ? document.exitFullscreen() : frame.requestFullscreen()).catch(() => {}); };
    bar.append(fs);
  }
  app.replaceChildren(el("div", { class:"player" }, bar, frame));
}

function route() {
  const m = location.hash.match(/^#\/play\/([\w-]+)$/);
  if (m) renderPlay(m[1]); else renderList();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
